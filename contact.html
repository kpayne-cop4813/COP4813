<!DOCTYPE html>
<html lang= "en">
<head>
  <meta charset="UTF-8">
  <title>Contact Form</title>
  <style>
      body { font-family: Arial, sans-serif; 
          line-height:1.6; 
          margin: 20px; }
    h1{color:#232326; text-align: center;}
    .topnav {
  text-align: center;
    background-color:#232326 ;}

.topnav a {
  color: white;
  text-align: center;
  padding: 14px 16px;
  font-size:18px;}

    footer {
  text-align: center;
  color: white;
  background-color: #232326 ;
}
</style>
        <script>

        function ValidateForm()
        {
            var form = document.forms["inputForm"];
          
            var fname = form["fname"].value;

            if (!ValidateNotBlank(fname, "First Name"))
                return false;
                
           var lname = form["lname"].value;

            if (!ValidateNotBlank(lname, "Last Name"))
                return false;
          
           var street = form["street"].value;

            if (!ValidateNotBlank(street, "Street Address"))
                return false;
              
          
        var city = form["city"].value;
            if (!ValidateNotBlank(city, "City"))
                return false;
                
        var state = form["state"].value;
            if (!ValidateNotBlank(state, "State"))
                return false;
          
                 var zip = form["zip"].value;
            if (!ValidateNotBlank(zip, "Zip Code"))
                return false;

            var phone = form["phone"].value;
            if (!ValidateNotBlank(phone, "Phone Number"))
                return false;

            var email = form["email"].value;
            if (!ValidateNotBlank(email, "Email Address"))
                return false;

            var bday = document.forms["inputForm"]["bday"].value;

            if (!ValidateNotBlank(bday, "Date"))
                return false;

            if (!ValidateDate())
                return false;

            var message = form["message"].value;
            if (!ValidateNotBlank(message, "Message"))
                return false;
          
          	var security = form.elements["security"].value;
           if (!ValidateNotBlank(security, "Security Question"))
            return false;

           if (security.trim() !== "5") {
          alert("Incorrect");
          return false;
      }
      return true;
        }

        function ValidateNotBlank(val, message) {
            if (val == null || val.trim() == "") {
                alert("Must enter a value for " + message);
                return false;
            }
        return true;
        }


        function ValidateDate()
        {
            var d = document.forms["inputForm"]["bday"].value;
            var d_as_date = new Date(d);
            var today = new Date();

            if (d_as_date > today)
            {
                alert("The date entered is after today");
                return false;
            }

            return true;
        }



function Confirmation(event) {
    event.preventDefault();

    if (!ValidateForm()) {
        return false; 
    }

    var form = document.forms["inputForm"];

    var summaryHTML = 
        "<strong>First Name:</strong> " + form["fname"].value + "<br>" +
        "<strong>Last Name:</strong> " + form["lname"].value + "<br>" +
        "<strong> Street Address:</strong> " + form["street"].value + "<br>" + 
          "<strong> City:</strong> " + form["city"].value + "<br>" + 
          "<strong> State:</strong> " + form["state"].value + "<br>" + 
        "<strong> Zip Code:</strong> " + form["zip"].value + "<br>" + 
        "<strong>Phone:</strong> " + form["phone"].value + "<br>" +
        "<strong>Email:</strong> " + form["email"].value + "<br>" +
        "<strong>Birthdate:</strong> " + form["bday"].value + "<br>" +
        "<strong>Message:</strong> " + form["message"].value +"<br>"+
   "<strong>Security Answer:</strong> " + form["security"].value;

document.getElementById("summaryText").innerHTML = summaryHTML;
      document.getElementById("inputForm").style.display = "none";
      document.getElementById("reviewSection").style.display = "block";

      return false;
    }

function submitForm() {
    document.getElementById("inputForm").submit();
}
          
function editForm() {
      
      document.getElementById("inputForm").style.display = "block";
      document.getElementById("reviewSection").style.display = "none";
    }

          
    </script>
  
</head>
   <body>
  <main>
  <h1>Contact Form</h1>
      <div class="topnav" >
      <a href='index.html'>Home</a>
      <a href='assignments.html'>My Assignments</a>
      <a href='about.html'>About Me</a>
    </div>
 
<br>

    <form name="inputForm"
      id="inputForm"
      onsubmit="return Confirmation(event);" 
          method="post"
          action="mailto:krista_payne@daytonastate.edu">

       <label for="fname">Input First Name:</label>
        <input type="text" id="fname" name="fname"
          placeholder="First Name">
        <br>
     <label for="lname">Input Last Name:</label>
       <input type="text" id="lname" name="lname"
         placeholder= "Last Name">
      <br>
         <label for="street">Input Street Address:</label>
   <input type="text" id="street" name="street" >
    <br>      
<label for="city">Input City:</label>
   <input type="text" id="city" name="city" >
    <br>   
    <label for="state">Input State:</label>
   <input type="text" id="state" name="state" >
    <br>  
    <label for="zip">Input Zip Code:</label>
   <input type="text" id="zip" name="zip" >
    <br>   
       <label for="phone">Input Phone Number:</label>
        <input type="text" id="phone" name="phone" 
          placeholder="(000) 000-0000">
        <br>
       <label for="email">Input Email Address:</label>
        <input type="email" id="email" name="email"
         placeholder="you@example.com">
        <br>
       <label for="bday">Input Birthdate:</label>
        <input type="date" id="bday" name="bday">
        <br>
         <label for="message">Input Message:</label>
       <textarea id="message" name="message" rows="5" cols="40"></textarea>
        <br>
<label for="security">Security Question: What is 2 + 3?</label>
        <input type="text" id="security" name="security">
<br>
 <input type="submit" value="submit">


    </form> 
    <div id="reviewSection" style="display:none; padding:20px;">
    <h2>Review Your Information</h2>
    <p id="summaryText"></p>
    <button type="button" onclick="submitForm()">Confirm and Submit</button>
<button type="button" onclick="editForm()">Edit Information</button>
</div>
      </main>
         <footer>
      <p> Created by Krista Payne</p>
    </footer>
  </body>
</html>
