<!DOCTYPE html>
<html lang= "en">
<head>
  <meta charset="UTF-8">
  <title>Drag Drop Cards</title>
  
<style>

    
  body { font-family: Arial, sans-serif;   
          line-height:1.6; 
         margin: 0;
      padding: 0;
       background-color: #f7f7f8}

  main {
      max-width: 800px;
      margin: 30px auto;
      padding: 0 20px;
      padding: 0 20px;  border-radius: 8px;  
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
       }

  footer {
   text-align: center;
   color: white;
   background-color: #232326 ;
   padding: 10px 0; 
   margin-top: 40px;
 }

.card {
    width: 50px;
    height: auto;
    cursor: grab;
    margin: 10px;
}

    .drop {
      width: 220px;
      min-height: 140px;
      background-color: #faf5ff;
      border: 2px dashed #d8b4fe;
      color: #6b21a8;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 500;
      transition: background-color 0.2s, border-color 0.2s;
    }

  .button-container {
  text-align: center;
} 

    #deal {
      background-color: #faf5ff ;
        color: #6b21a8;
      border: 2px dashed #d8b4fe;
      padding: 10px 20px;
      font-size: 1rem;
      font-weight: 500;
      border-radius: 6px;
      cursor: pointer;
       transition: background-color 0.2s, border-color 0.2s;
    }
  
    .table-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      margin-top: 25px;
    }     
      </style>
    </head>
   <body>
  <main>

    <h1> Drag & Drop Cards </h1>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://code.jquery.com/ui/1.10.3/jquery-ui.js"></script>
<div class="button-container">
  <input type="button" value="Deal Card" id="deal">
</div>
<br/>
    <div class="table-area">
  <div id="card-container"></div>
<div id='drop' class='drop'>Drop Here</div>

      </main>
         <footer>
      <p> Created by Krista Payne</p>
    </footer>

     
     <script>


       
function randomCard() {
   return Math.floor(Math.random() * numberOfCardsInDeck);  
}

       
$('#deal').click(function () { dealCard();
});

var cardsInDeck = [];
var numberOfCardsInDeck = 0;

       
var suits = ['C', 'D', 'H', 'S'];

for (var i = 0; i < suits.length; i++) {
    for (var j = 1; j <= 13; j++) {
        cardsInDeck.push(suits[i] + j);
    }
}

      numberOfCardsInDeck = cardsInDeck.length;

function init() {
  $('.drop').droppable( {
    drop: handleDropEvent
  } );   
}

init();


function dealCard() {

    var c = randomCard();
    var cardName = cardsInDeck[c];
    var img = document.createElement("img");
    img.src = cardName + ".png";
    img.id = cardName;
    img.className = "card";
    document.getElementById("card-container").appendChild(img);
   
    $('img').draggable();

    removeCard(c);
}



function handleDropEvent( event, ui ) {
  var draggable = ui.draggable;
  $('#drop').html( ui.draggable.attr('id'));
    
}




function removeCard(c)
{

    for (j=c; j <= numberOfCardsInDeck - 2; j++)
    {
        cardsInDeck[j] = cardsInDeck[j+1];
    }
    numberOfCardsInDeck--;
}
     </script>
  </body>

</html>
