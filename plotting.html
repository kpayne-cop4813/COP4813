<!DOCTYPE html>
<html lang= "en">
<head>
  <meta charset="UTF-8">
  <title>Plotting</title>
  <link rel="stylesheet" 
  href="https://cdnjs.cloudflare.com/ajax/libs/highcharts/12.4.0/css/highcharts.css">
  <script src="https://code.highcharts.com/highcharts.js"></script>
   <style>
    
  body { font-family: Arial, sans-serif;   
          line-height:1.6; 
         margin: 0;
      padding: 0;
       background-color: #f7f7f8}
    
    h1 { 
      color:#232326; text-align: center; margin-top: 20px;
      }
    
main {
      max-width: 800px;
      margin: 30px auto;
      padding: 0 20px;
 padding: 0 20px;  border-radius: 8px;  
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
    }

    footer {
  text-align: center;
  color: white;
  background-color: #232326 ;
  padding: 10px 0; 
  margin-top: 40px;
}
  </style>
</head>
   <body>
  <main>
  <h1>JavaScipt Calculator with Plotting </h1>
    <p>       
      <div class="calculator">
   <label for="minimum">
                Minimum:
            </label>

            <input
                type="text"
                id="minimum"
                value="1"
            >

            <label for="maximum">
                Maximum:
            </label>

            <input
                type="text"
                id="maximum"
                value="10"
            >

            <button onclick="calculate()">
                Click
            </button>

        </div>

        <div id="results"></div>

        <div id="chart"></div> </p>
  </main>
    <footer>
      <p> Created by Krista Payne</p>
    </footer>


     
     <script>
function calculate() {

            let minimum = parseInt(
                document.getElementById("minimum").value
            );

            let maximum = parseInt(
                document.getElementById("maximum").value
            );




            document.getElementById("results").innerHTML =
                "Input range: " + minimum + " to " + maximum;


            makePlot(minimum, maximum);
        }

function factorial(n) {
    let result = 1;

    for (let i = 2; i <= n; i++) {
        result *= i;
    }

    return result;
}


    function makePlot(minimum, maximum) {

    let nValues = [];
    let oLogN = []; let oN = []; let oNLogN = []; let oNSquared = []; let oTwoN = []; let oFactorial = [];

    for (let i = minimum; i <= maximum; i++) {
        nValues.push(i);
        oLogN.push(Math.log2(i));
        oN.push(i);
        oNLogN.push(i * Math.log2(i));
        oNSquared.push(i * i);
        oTwoN.push(Math.pow(2, i));
        oFactorial.push(factorial(i));
        }
  
  Highcharts.chart('chart', {
        xAxis: { categories: nValues, title: { text: 'Input Size (n)' } },
        yAxis: { title: { text: 'Growth' } },
        title: {text: 'Big-O Notation'},
        series: [
            { name: 'O(log n)', data: oLogN },
            { name: 'O(n)', data: oN },
            { name: 'O(n log n)', data: oNLogN },
            { name: 'O(n^2)', data: oNSquared },
            { name: 'O(2^n)', data: oTwoN },
            { name: 'O(n!)', data: oFactorial },
        ]

    });
  }
window.onload = function() {
            makePlot(1,10);
        };
     </script>
  </body>

</html>
