main {

td {

    padding: 10px;
}

.completed, .all, .semester {
    border: 2px solid black;
    padding: 10px;
    min-height: 200px;
    background: white;
}

.course {
    background: lightgreen;
    border: 1px solid green;
    padding: 10px;
    margin: 5px;
    cursor: grab;
}

.notAvailable {
    background: lightyellow;
    border: 1px solid orange;
    padding: 10px;
    margin: 5px;
}

button {
    padding: 8px;
    margin: 5px;
    cursor: pointer;
}

</head>

var courses = JSON.parse(courselist);

var specializations = JSON.parse(specialization);

var completed = [];

var semester1 = [];
var semester2 = [];
var summer = [];
var semester3 = [];
var semester4 = [];

var undoList = [];

var selectedCourse = "";

var destinationTermMap = {
    "semester1": "Fall",
    "semester2": "Spring",
    "summer": "Summer",
    "semester3": "Fall",
    "semester4": "Spring"
};

function isOfferedInTerm(course, term) {

    if (!course.offered || course.offered.length === 0) {
        return false;
    }

    var availableTerms = [];

    course.offered.forEach(function(item) {

        var parts = item.split(",");

        parts.forEach(function(p) {
            availableTerms.push(p.trim().toLowerCase());
        });

    });

    return availableTerms.includes(term.toLowerCase());
}


function prerequisitesMet(course, destination) {

    if (!course.prerequisites ||
        course.prerequisites.length === 0) {
        return true;
    }

    var semesterOrder = {
        semester1: 1,
        semester2: 2,
        summer: 3,
        semester3: 4,
        semester4: 5
    };

    var destinationOrder = semesterOrder[destination];

    var takenCourses = completed.slice();

    if (destinationOrder) {

        if (destinationOrder > 1) {
            takenCourses = takenCourses.concat(semester1);
        }

        if (destinationOrder > 2) {
            takenCourses = takenCourses.concat(semester2);
        }

        if (destinationOrder > 3) {
            takenCourses = takenCourses.concat(summer);
        }

        if (destinationOrder > 4) {
            takenCourses = takenCourses.concat(semester3);
        }

    } else {

        takenCourses = takenCourses.concat(
            semester1,
            semester2,
            summer,
            semester3,
            semester4
        );

    }

    for (var i = 0; i < course.prerequisites.length; i++) {

        var rule = course.prerequisites[i];

        if (rule.type == "AND") {

            var allFound = rule.courses.every(function(code) {

                return takenCourses.some(function(c) {
                    return c.code.trim() == code.trim();
                });

            });

            if (!allFound) {
                return false;
            }
        }

        if (rule.type == "OR") {

            var oneFound = rule.courses.some(function(code) {

                return takenCourses.some(function(c) {
                    return c.code.trim() == code.trim();
                });

            });

            if (!oneFound) {
                return false;
            }
        }
    }

    return true;
}


function createList() {

    document.getElementById("all").innerHTML = "";

    var track = document.getElementById("specialization").value;

    var allCourses = courses.concat(
        specializations[track].map(function(c) {

            return {
                ...c,
                group: "Specialization",
                prerequisites: c.prerequisites || [],
                details: c.details || "Specialization course."
            };

        })
    );

    allCourses.forEach(function(course) {

        if (
            completed.some(c => c.code == course.code) ||
            semester1.some(c => c.code == course.code) ||
            semester2.some(c => c.code == course.code) ||
            summer.some(c => c.code == course.code) ||
            semester3.some(c => c.code == course.code) ||
            semester4.some(c => c.code == course.code)
        ) {
            return;
        }

        var met = prerequisitesMet(course);
        var div = document.createElement("div");

        div.innerHTML =
            "<b>" + course.code + "</b><br>" +
            course.name + "<br>" +
            course.hours + " Credits<br>" +
            "Offered: " +
            (course.offered && course.offered.length
                ? course.offered.join(", ")
                : "Not yet confirmed") +
            "<br>" +
            course.details;

        div.className = met ? "course" : "notAvailable";

        div.draggable = met;

        div.id = course.code;

        div.ondragstart = function(event) {
            selectedCourse = course.code;
        };

        document.getElementById("all").appendChild(div);

    });

}


function allowDrop(event) {
    event.preventDefault();
}


function dropCourse(event, destination) {

    event.preventDefault();

    var course = findCourse(selectedCourse);

    if (!course) {
        return;
    }

    if (destination == "completed") {

        undoList.push({
            course: course,
            destination: destination
        });

        completed.push(course);

        updateDisplay();
        return;
    }

    var term = destinationTermMap[destination];

    if (!isOfferedInTerm(course, term)) {

        alert(course.code + " is not being offered in " + term + ".");

        return;
    }

    if (!prerequisitesMet(course, destination)) {

        alert("Prerequisites for " + course.code +
              " have not been completed");

        return;
    }

    undoList.push({
        course: course,
        destination: destination
    });

    if (destination == "semester1") {
        semester1.push(course);
    }

    if (destination == "semester2") {
        semester2.push(course);
    }

    if (destination == "summer") {
        summer.push(course);
    }

    if (destination == "semester3") {
        semester3.push(course);
    }

    if (destination == "semester4") {
        semester4.push(course);
    }

    updateDisplay();

}


function findCourse(code) {

    var track = document.getElementById("specialization").value;

    var list = courses.concat(specializations[track]);

    return list.find(function(c) {
        return c.code == code;
    });

}
function updateDisplay() {

    document.getElementById("completedList").innerHTML =
        "Completed Courses:<br>" +
        completed.map(c => c.code + " - " + c.name).join("<br>");

    document.getElementById("completedHours").innerHTML =
        "Hours: " +
        completed.reduce((sum, c) => sum + c.hours, 0);


    document.getElementById("semester1List").innerHTML =
        semester1.map(c => c.code + " - " + c.name).join("<br>");

    document.getElementById("semester2List").innerHTML =
        semester2.map(c => c.code + " - " + c.name).join("<br>");

    document.getElementById("summerList").innerHTML =
        summer.map(c => c.code + " - " + c.name).join("<br>");

    document.getElementById("semester3List").innerHTML =
        semester3.map(c => c.code + " - " + c.name).join("<br>");

    document.getElementById("semester4List").innerHTML =
        semester4.map(c => c.code + " - " + c.name).join("<br>");


    document.getElementById("semester1Hours").innerHTML =
        "Hours: " + semester1.reduce((sum, c) => sum + c.hours, 0);

    document.getElementById("semester2Hours").innerHTML =
        "Hours: " + semester2.reduce((sum, c) => sum + c.hours, 0);

    document.getElementById("summerHours").innerHTML =
        "Hours: " + summer.reduce((sum, c) => sum + c.hours, 0);

    document.getElementById("semester3Hours").innerHTML =
        "Hours: " + semester3.reduce((sum, c) => sum + c.hours, 0);

    document.getElementById("semester4Hours").innerHTML =
        "Hours: " + semester4.reduce((sum, c) => sum + c.hours, 0);

    createList();

}


function whatCanITake() {

    var available = courses.concat(
        specializations[
            document.getElementById("specialization").value
        ]
    );

    var result = "<h2>Courses You Can Take</h2>";

    available.forEach(function(course) {

        if (
            prerequisitesMet(course) &&
            !completed.some(c => c.code == course.code) &&
            !semester1.some(c => c.code == course.code) &&
            !semester2.some(c => c.code == course.code) &&
            !summer.some(c => c.code == course.code) &&
            !semester3.some(c => c.code == course.code) &&
            !semester4.some(c => c.code == course.code)
        ) {

            var availableTerms = course.offered || [];

            if (availableTerms.length > 0) {

                result +=
                    course.code + " - " +
                    course.name +
                    " (Offered: " +
                    availableTerms.join(", ") +
                    ")<br>";

            }

        }

    });

    document.getElementById("results").innerHTML = result;

}


function undo() {

    if (undoList.length == 0) {
        return;
    }

    var last = undoList.pop();

    if (last.destination == "completed") {
        completed.pop();
    }

    if (last.destination == "semester1") {
        semester1.pop();
    }

    if (last.destination == "semester2") {
        semester2.pop();
    }

    if (last.destination == "summer") {
        summer.pop();
    }

    if (last.destination == "semester3") {
        semester3.pop();
    }

    if (last.destination == "semester4") {
        semester4.pop();
    }

    updateDisplay();

}


createList();

</script>
